# Measure coverage of the product package only -- `bagof.dispatchers`, matching
# `pyproject.toml`'s `[tool.coverage.run] source`. Test files are excluded so
# that version-gated (`skipif`) and thread-only test bodies, which never run on
# a single coverage interpreter, do not count as "missing" lines against the
# patch/project targets.
ignore:
  - "tests"
  - "tests/**"
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%
comment:
  layout: "reach, diff, flags, files"
  require_changes: false
