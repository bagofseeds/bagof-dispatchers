name: Test on push
description: Test on push

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - pyproject.toml
      - .github/workflows/test*.yaml
      # The suite executes the examples in the hand-written pages, so a
      # change to one of those can turn it red on its own.
      - README.md
      - docs/**
  pull_request:
    paths:
      - src/**
      - tests/**
      - pyproject.toml
      - .github/workflows/test*.yaml
      # The suite executes the examples in the hand-written pages, so a
      # change to one of those can turn it red on its own.
      - README.md
      - docs/**

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/test-matrix.yaml
